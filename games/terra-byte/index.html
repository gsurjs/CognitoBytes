<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' https://www.google-analytics.com https://www.googletagmanager.com https://vercel.live;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com;
               frame-src 'self' https://vercel.live;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌍 TerraByte - Country Guessing Game</title>
    <link rel="stylesheet" href="/games/terra-byte/styles.css">
    <script src="/analytics.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">🌍 TerraByte</h1>

            <div class="navigation">
                <a href="../../" class="nav-button">🕹️ Back to Games</a>
            </div>

            <div class="button-container">
                <button class="share-button" id="shareButton" style="display: none;">💬 SHARE</button>
                <button id="statsButton" class="control-button" style="display: none;">📊 Stats</button>
                <button class="new-game-button" id="newGameButton" style="display: none;">NEW GAME</button>
            </div>

            <div class="game-mode-selector">
                <button class="mode-button active" id="dailyMode">📅 Daily</button>
                <button class="mode-button" id="practiceMode">♾️ Practice</button>
            </div>
        </div>

        <div class="game-content">
            <div class="game-info">
                <div class="guess-count" id="guessCount">Guesses: 0</div>
                <div class="closest-distance" id="closestDistance">Closest: —</div>
            </div>

            <div class="message" id="message">
                <p>Guess the mystery country! Warmer colors = closer.</p>
            </div>

            <div class="guess-input-section">
                <form id="guessForm" autocomplete="off">
                    <div class="input-wrapper">
                        <input type="text" id="guessInput" placeholder="Enter a country..."
                               autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
                        <button type="submit" id="guessButton">GUESS</button>
                        <div class="suggestions" id="suggestions" style="display: none;"></div>
                    </div>
                </form>
            </div>

            <div class="globe-wrap" id="globeWrap">
                <div class="globe-loading" id="globeLoading">🌍 Loading globe...</div>
            </div>

            <div class="guess-chips" id="guessChips"></div>

            <div class="bottom-section">
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="gamesWon">0</div>
                        <div class="stat-label">Games Won</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="gamesPlayed">0</div>
                        <div class="stat-label">Games Played</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="winStreak">0</div>
                        <div class="stat-label">Win Streak</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="statsModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <button class="modal-close-button">&times;</button>
                <h2>Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div id="statsPlayed" class="stat-value">0</div>
                        <div class="stat-label">Played</div>
                    </div>
                    <div class="stat-item">
                        <div id="statsAvgGuesses" class="stat-value">0</div>
                        <div class="stat-label">Avg Guesses</div>
                    </div>
                    <div class="stat-item">
                        <div id="statsCurrentStreak" class="stat-value">0</div>
                        <div class="stat-label">Current Streak</div>
                    </div>
                    <div class="stat-item">
                        <div id="statsMaxStreak" class="stat-value">0</div>
                        <div class="stat-label">Max Streak</div>
                    </div>
                </div>
                <h3>Guess Distribution</h3>
                <div id="guessDistribution" class="distribution-grid"></div>
            </div>
        </div>
    </div>

    <script src="/games/terra-byte/three.min.js"></script>
    <script src="/games/terra-byte/scripts.js"></script>
    <script src="/games/alpha-bit/orientation-lock.js"></script>
</body>
</html>
