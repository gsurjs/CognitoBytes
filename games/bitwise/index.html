<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' https://www.google-analytics.com https://www.googletagmanager.com https://vercel.live;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com;
               frame-src 'self' https://vercel.live;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧮 BitWise - Daily Number Puzzle</title>
    <meta name="description" content="Combine six numbers with + − × ÷ to hit the target in the fewest ops.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Cognito Bytes">
    <meta property="og:title" content="BitWise — Daily Number Target">
    <meta property="og:description" content="Combine six numbers with + − × ÷ to hit the target in the fewest ops.">
    <meta property="og:url" content="https://cognitobytes.com/games/bitwise/">
    <meta property="og:image" content="https://cognitobytes.com/assets/images/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/games/bitwise/styles.css">
    <script src="/analytics.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <a href="../../" class="nav-mini"><svg viewBox="0 0 16 16" width="11" height="11"><path d="M10 3L5 8l5 5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>GAMES</a>

            <div class="lockup">
                <div class="badge" style="background: linear-gradient(135deg, #6c3483, #2e86c1);">🧮</div>
                <div class="lockup-text">
                    <h1 class="game-name">BITWISE</h1>
                    <div class="game-tag">DAILY NUMBER TARGET</div>
                </div>
            </div>

            <div class="button-container">
                <button class="share-button" id="shareButton" style="display: none;">SHARE</button>
                <button id="statsButton" class="control-button" style="display: none;">STATS</button>
                <button class="new-game-button" id="newGameButton" style="display: none;">NEW GAME</button>
            </div>

            <div class="game-mode-selector">
                <button class="mode-button active" id="dailyMode">📅 Daily</button>
                <button class="mode-button" id="practiceMode">♾️ Practice</button>
            </div>
        </div>

        <div class="game-content">
            <div class="target-banner">
                <div class="target-label">TARGET</div>
                <div class="target-value" id="targetValue">0</div>
                <div class="ops-count" id="opsCount">0 ops</div>
            </div>

            <div class="message" id="message">
                <p>Combine the numbers with + − × ÷ to hit the target!</p>
            </div>

            <div class="num-chips" id="numChips"></div>

            <div class="op-row" id="opRow">
                <button type="button" class="op-button" data-op="+">＋</button>
                <button type="button" class="op-button" data-op="-">－</button>
                <button type="button" class="op-button" data-op="*">×</button>
                <button type="button" class="op-button" data-op="/">÷</button>
            </div>

            <div class="tool-row">
                <button type="button" class="tool-button" id="undoButton">↩ UNDO</button>
                <button type="button" class="tool-button" id="resetButton">⟲ RESET</button>
            </div>

            <div class="bottom-section">
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="gamesWon">0</div>
                        <div class="stat-label">Games Won</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="gamesPlayed">0</div>
                        <div class="stat-label">Games Played</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="winStreak">0</div>
                        <div class="stat-label">Win Streak</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="statsModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <button class="modal-close-button">&times;</button>
                <h2>Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div id="statsPlayed" class="stat-value">0</div>
                        <div class="stat-label">Played</div>
                    </div>
                    <div class="stat-item">
                        <div id="statsBestOps" class="stat-value">—</div>
                        <div class="stat-label">Best Ops</div>
                    </div>
                    <div class="stat-item">
                        <div id="statsCurrentStreak" class="stat-value">0</div>
                        <div class="stat-label">Current Streak</div>
                    </div>
                    <div class="stat-item">
                        <div id="statsMaxStreak" class="stat-value">0</div>
                        <div class="stat-label">Max Streak</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/share-modal.js"></script>
    <script src="/games/bitwise/scripts.js"></script>
    <script src="/games/alpha-bit/orientation-lock.js"></script>
</body>
</html>
